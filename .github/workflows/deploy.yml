# Deploy to WP.org
name: Deploy to WordPress.org

# Deploys when a GitHub release is published.
on:
  release:
    types: [published]

permissions:
  contents: read

# Never run two SVN deploys at once; queue instead of cancelling mid-commit.
concurrency:
  group: deploy-wporg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The 10up action publishes the tag name (minus a leading "v") as the SVN
      # tag, so all version sources must agree before anything is built.
      - name: Verify tag matches plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^[[:space:]*]*Version:' interactive-promo.php | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//')
          readme=$(grep -m1 -iE '^Stable tag:' readme.txt | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//')
          constant=$(grep -m1 -E "define\([[:space:]]*['\"]INTERACTIVE_PROMO_BLOCKS_VERSION['\"]" interactive-promo.php | sed -E "s/.*,[[:space:]]*['\"]([^'\"]+)['\"].*/\1/")

          fail=0
          check() {
            if [ "$3" = "$tag" ]; then
              echo "$1: $3"
            else
              echo "::error file=$2::$1 is '$3' but the tag is '$tag'"
              fail=1
            fi
          }
          check "Version header" interactive-promo.php "$header"
          check "Stable tag" readme.txt "$readme"
          check INTERACTIVE_PROMO_BLOCKS_VERSION interactive-promo.php "$constant"
          exit $fail

      # The controls and style-handler submodules are private repos, which
      # GITHUB_TOKEN can't read. CONTROLS_PAT is a fine-grained PAT limited to
      # EssentialBlocks/controls and EssentialBlocks/style-handler with
      # Contents: read-only.
      - name: Resolve submodule commits
        id: submodules
        run: |
          echo "controls=$(git rev-parse HEAD:controls)" >> "$GITHUB_OUTPUT"
          echo "style_handler=$(git rev-parse HEAD:lib/style-handler)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/controls
          ref: ${{ steps.submodules.outputs.controls }}
          path: controls
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/style-handler
          ref: ${{ steps.submodules.outputs.style_handler }}
          path: lib/style-handler
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `npm ci` (not `npm install`) so the release is built from the committed
      # lockfile instead of whatever the registry resolves on the day.
      - name: Install root dependencies
        run: npm ci

      # Builds dist/index.js + dist/index.asset.php from src/.
      - name: Build root bundle
        run: npm run build

      # `controls` is a git submodule with its own package.json, lockfile and
      # node_modules. It is NOT covered by the root build: the root webpack
      # entry is ./src/index.js only. Without these two steps dist/modules.js,
      # dist/modules.css and dist/frontend.js ship as whatever was last
      # committed, which silently goes stale when the submodule pointer moves.
      #
      # Running in `controls/` means npm resolves that project's own webpack and
      # @wordpress/scripts, never the root project's.
      #
      # The install needs legacy peer-dep resolution (react-sortable-hoc@2 peers
      # react ^16||^17 against @wordpress/* peering react ^18); that is declared
      # in controls/.npmrc rather than passed here, so local and CI installs
      # resolve identically.
      - name: Install controls dependencies
        working-directory: controls
        run: npm ci

      - name: Build controls bundles
        working-directory: controls
        run: npm run build

      # Fail loudly rather than shipping a half-built dist/. A webpack run that
      # errors on a missing module can still exit having written nothing.
      - name: Verify build artifacts
        run: |
          for artifact in \
            dist/index.js \
            dist/index.asset.php \
            dist/modules.js \
            dist/modules.css \
            dist/modules.asset.php \
            dist/frontend.js \
            dist/frontend.asset.php
          do
            if [ ! -s "$artifact" ]; then
              echo "::error::missing or empty build artifact: $artifact"
              exit 1
            fi
          done
          echo "All expected build artifacts present."

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
